<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="icon" href="/image/icon.png">

<body>
    <canvas class="webgl"></canvas>
    <button class="info"><img src="/image/icon.png" alt="info"></button>
    <div class="menu">
        <div id="geometry">
            <button class="left_arrow" id="geometryLeftArrow"><img src="/image/LeftControl.svg" alt="left_arrow"></button>

                <div class="title"><p>Geometry</p></div>

        <div id="material">
            <button class="left_arrow" id="materialLeftArrow"><img src="/image/LeftControl.svg" alt="left_arrow"></button>

                <div class="title"><p>Material</p></div>
                <div class="image"><img src="/image/basic.png" id="materialImage" alt="Material"></div>

            <button class="right_arrow" id="materialRightArrow"><img src="/image/RightControl.svg" alt="right_arrow"></button>
        </div>
    </div>
    <div class="dialog-box">
        <div class="titulo-dialog-box">
            <p></p>
        </div>
        <div class="contenido-dialog-box">
            <p></p>
        </div>
        <div class="botones">
            <button class="button-dialog" id="back">Back</button>
            <button class="button-dialog" id="next">Next</button>
            <button class="button-dialog" id="skip">Skip</button>
        </div>
    </div>
    <div class="gui-light"></div>
</body>
</html>
